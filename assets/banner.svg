<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>XXD Panel 029</title>
  <desc>Rough ivory handmade paper, one source-derived low-saturation horizontal paper field, a loose light wax-pastel cyclist crossing its edge, broken friction, restrained Risograph misregistration, and soft handwriting.</desc>
  <defs>
    <clipPath id="frame"><rect width="1200" height="400" rx="30"/></clipPath>
    <pattern id="fibre" width="46" height="38" patternUnits="userSpaceOnUse">
      <path d="M2 8C10 6 16 8 24 5M28 29C34 26 39 27 45 24M7 36L17 33M33 13L41 11" stroke="#554E43" stroke-opacity=".09" stroke-width=".8" stroke-linecap="round"/>
      <circle cx="29" cy="9" r=".7" fill="#554E43" fill-opacity=".08"/><circle cx="15" cy="23" r=".55" fill="#554E43" fill-opacity=".07"/>
    </pattern>
    <pattern id="riso" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r=".7" fill="#314D49" fill-opacity=".22"/><circle cx="5.6" cy="4.8" r=".55" fill="#314D49" fill-opacity=".16"/>
    </pattern>
    <filter id="rough" x="-12%" y="-20%" width="124%" height="140%"><feTurbulence type="fractalNoise" baseFrequency=".018 .08" numOctaves="2" seed="29" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="3.2" xChannelSelector="R" yChannelSelector="G"/></filter>
    <filter id="wax" x="-20%" y="-25%" width="140%" height="150%"><feTurbulence type="fractalNoise" baseFrequency=".09" numOctaves="3" seed="14" result="grain"/><feComposite in="grain" in2="SourceGraphic" operator="in" result="texture"/><feBlend in="SourceGraphic" in2="texture" mode="multiply"/></filter>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="#F2EDDF"/><rect width="1200" height="400" fill="url(#fibre)"/>
    <path d="M0 174C174 169 353 178 523 173C720 167 957 177 1200 171V318C970 313 757 321 531 315C333 310 157 319 0 314V174Z" fill="#AAB9A9" filter="url(#rough)"/>
    <path d="M0 180C181 174 365 182 534 177C738 172 964 181 1200 175V319C950 314 742 322 528 317C329 312 152 320 0 315V180Z" fill="url(#riso)" opacity=".72"/>
    <path d="M0 316C212 320 390 311 536 317C748 324 980 314 1200 319" stroke="#5B675D" stroke-opacity=".3" stroke-width="3" filter="url(#rough)"/>
    <g transform="translate(890 118)" stroke-linecap="round" stroke-linejoin="round">
      <g transform="translate(5 3)" opacity=".28" stroke="#D47A67"><circle cx="61" cy="172" r="55" stroke-width="12"/><circle cx="226" cy="172" r="55" stroke-width="12"/><path d="M61 172L121 89L165 172H61ZM121 89L188 91L226 172M165 172L188 91M108 73L136 73" stroke-width="13"/></g>
      <g stroke="#F4E7B6" filter="url(#wax)"><circle cx="61" cy="172" r="55" stroke-width="11" stroke-dasharray="72 11 34 8"/><circle cx="226" cy="172" r="55" stroke-width="11" stroke-dasharray="64 9 42 12"/><path d="M61 172L121 89L165 172H61ZM121 89L188 91L226 172M165 172L188 91M108 73L136 73" stroke-width="12" stroke-dasharray="96 7 31 6"/></g>
      <g filter="url(#wax)"><circle cx="131" cy="40" r="19" fill="#E7B67C"/><path d="M121 60C143 62 158 77 160 103L137 126L112 94Z" fill="#D9826A"/><path d="M112 93L87 121M153 87L188 91M136 124L165 171M130 125L98 167" stroke="#F0D9A7" stroke-width="16"/><path d="M114 21C126 7 149 11 154 27C143 26 134 30 128 38C125 31 120 26 114 21Z" fill="#334D49"/></g>
      <path d="M20 233C89 224 164 230 258 220" stroke="#F3E8C4" stroke-opacity=".78" stroke-width="5" stroke-dasharray="19 8 7 10" filter="url(#rough)"/>
    </g>
    <text x="818" y="346" fill="#334D49" font-family="cursive" font-size="21" font-style="italic" transform="rotate(-2 818 346)">leave a little road unfinished</text>
    <path d="M814 354C902 344 1019 357 1129 346" stroke="#334D49" stroke-opacity=".55" stroke-width="2.2" stroke-dasharray="45 8 18 11" filter="url(#rough)"/>
  </g>
  <g transform="translate(62 50)">
    <rect width="229" height="34" rx="7" fill="#334D49" filter="url(#rough)"/><text x="17" y="22" fill="#F2EDDF" font-family="Arial, sans-serif" font-size="13" font-weight="900" letter-spacing="2">🦁 XXD / IMAGE SKILL</text>
    <text x="0" y="112" fill="#313D3A" font-family="Georgia, serif" font-size="67" font-weight="700" letter-spacing="-3">PANEL <tspan fill="#C86E5C">029</tspan></text>
    <text x="2" y="151" fill="#334D49" font-family="Arial, sans-serif" font-size="18" font-weight="900" letter-spacing=".8">HORIZONTAL FIELD · WAX PASTEL · HANDMADE PAPER</text>
    <text x="2" y="196" fill="#313D3A" font-family="sans-serif" font-size="18" font-weight="800">横向低饱和纸色域 · 松弛蜡粉笔 · 粗纤维手工纸</text>
    <text x="2" y="226" fill="#313D3A" fill-opacity=".76" font-family="sans-serif" font-size="14" font-weight="700">横長の低彩度色面とワックスパステル · 가로 저채도 색면과 왁스 파스텔</text>
    <text x="2" y="256" fill="#313D3A" fill-opacity=".76" font-family="Arial, sans-serif" font-size="14" font-weight="700">حقل أفقي منخفض التشبع وباستيل شمعي مسترخٍ</text>
  </g>
  <g transform="translate(62 327)">
    <rect width="161" height="37" rx="7" fill="#334D49" filter="url(#rough)"/><text x="80.5" y="24" text-anchor="middle" fill="#F2EDDF" font-family="Courier New, monospace" font-size="12" font-weight="900">SOURCE COLOUR</text>
    <rect x="173" width="177" height="37" rx="7" fill="#C86E5C" filter="url(#rough)"/><text x="261.5" y="24" text-anchor="middle" fill="#F2EDDF" font-family="Courier New, monospace" font-size="12" font-weight="900">BROKEN FRICTION</text>
    <rect x="362" width="107" height="37" rx="7" fill="#AAB9A9" filter="url(#rough)"/><text x="415.5" y="24" text-anchor="middle" fill="#313D3A" font-family="Courier New, monospace" font-size="12" font-weight="900">4 MODES</text>
    <rect x="481" width="180" height="37" rx="7" fill="#E7B67C" filter="url(#rough)"/><text x="571" y="24" text-anchor="middle" fill="#313D3A" font-family="Courier New, monospace" font-size="12" font-weight="900">WALLPAPER PACK</text>
  </g>
</svg>
